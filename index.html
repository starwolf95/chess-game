<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>西洋棋・對弈</title>
<style>
:root{--bg:#101713;--panel:#1a241e;--text:#edf1e7;--muted:#aab5a7;--gold:#d7ad67;--light:#e8dfc9;--dark:#71866f;--green:#9fbe76;--red:#d87565}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0,#27372b 0,transparent 44%),var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:28px 16px}.app{width:min(1080px,100%)}header{display:flex;align-items:center;justify-content:space-between;margin:0 0 20px}h1{font-size:clamp(25px,4vw,36px);margin:0;letter-spacing:.04em}h1 span{color:var(--gold)}.sub{color:var(--muted);font-size:14px;margin-top:4px}.layout{display:grid;grid-template-columns:minmax(300px,680px) minmax(240px,310px);gap:22px;align-items:start}.board-wrap{background:#202b23;padding:clamp(10px,2vw,20px);border-radius:18px;box-shadow:0 18px 55px #0007;border:1px solid #ffffff12}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:5px;overflow:hidden;user-select:none}.sq{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;cursor:pointer}.sq.light{background:var(--light)}.sq.dark{background:var(--dark)}.sq.selected{box-shadow:inset 0 0 0 5px var(--green)}.sq.last{background-image:linear-gradient(#d9c76a66,#d9c76a66)}.sq.check{background-image:radial-gradient(ellipse,#df594b 0%,#df594b99 55%,transparent 75%)}.piece{font-family:"Segoe UI Symbol","Arial Unicode MS",serif;font-size:clamp(28px,7.2vw,68px);line-height:1;filter:drop-shadow(0 2px 1px #0004);z-index:1}.piece.white{color:#fffdf4;text-shadow:0 1px 2px #17221b,1px 2px 1px #263326}.piece.black{color:#17201a;text-shadow:0 1px 1px #ffffff70}.sq.hint:after{content:"";position:absolute;width:24%;height:24%;border-radius:50%;background:#24332270}.sq.capture:after{content:"";position:absolute;inset:5%;border:5px solid #2533238c;border-radius:50%}.coord{position:absolute;font-size:11px;font-weight:700;left:4px;bottom:2px;z-index:2;opacity:.8}.coord.file{left:auto;right:4px;top:2px;bottom:auto}.light .coord{color:#71866f}.dark .coord{color:#f1e8d4}.side{display:flex;flex-direction:column;gap:14px}.card{background:var(--panel);border:1px solid #ffffff10;border-radius:15px;padding:17px}.turn{display:flex;align-items:center;gap:12px}.turn-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffffff12;font-size:26px}.turn strong{font-size:17px}.turn small{display:block;color:var(--muted);margin-top:2px}.status{min-height:22px;margin-top:14px;color:var(--gold);font-weight:600}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}button{font:inherit;border:1px solid #ffffff20;background:#25332a;color:var(--text);padding:10px 12px;border-radius:9px;cursor:pointer;transition:.15s}button:hover:not(:disabled){background:#344637;border-color:#ffffff40;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#a98245;border-color:#a98245;color:#151a13}.primary:hover:not(:disabled){background:#c09757}.label{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:0 0 10px}.moves{height:235px;overflow:auto;background:#111a14;border-radius:9px;padding:8px 10px;font:14px/1.8 ui-monospace,Consolas,monospace}.move-row{display:grid;grid-template-columns:34px 1fr 1fr;gap:4px;border-bottom:1px solid #ffffff0b}.move-row span:first-child{color:var(--muted)}.hinttext{font-size:13px;color:var(--muted);margin:0}.promotion{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:5}.promotion.show{display:grid}.modal{background:#202b23;padding:22px;border-radius:15px;box-shadow:0 18px 60px #0009}.choices{display:flex;gap:8px;margin-top:12px}.choices button{font-size:36px;width:62px;height:65px;padding:4px}.footer{margin-top:16px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:760px){body{padding:16px 12px}.layout{grid-template-columns:1fr;gap:12px}.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card.moves-card{grid-column:1/-1}.moves{height:155px}.board-wrap{padding:9px}.piece{font-size:clamp(28px,10vw,60px)}}@media(max-width:390px){.side{grid-template-columns:1fr}.card.moves-card{grid-column:auto}}
</style>
</head>
<body><main class="app"><header><div><h1>西洋棋 <span>♟</span></h1><div class="sub">兩人同機・經典對弈</div></div><div style="color:var(--gold);font-size:13px">♔　策略，從此刻開始</div></header>
<div class="layout"><section class="board-wrap"><div id="board" class="board" aria-label="西洋棋棋盤"></div></section><aside class="side"><section class="card"><div class="turn"><div id="turnIcon" class="turn-icon">♙</div><div><strong id="turnTitle">白方回合</strong><small>點選棋子，再點目的格</small></div></div><div id="status" class="status">白方先行</div><div class="actions"><button id="undo">↶ 悔棋</button><button id="flip">⇅ 翻轉棋盤</button><button id="new" class="primary" style="grid-column:1/-1">＋ 新對局</button></div></section><section class="card moves-card"><p class="label">對局紀錄</p><div id="moves" class="moves"><span style="color:#aab5a7">尚未開始走棋</span></div></section><section class="card"><p class="label">遊戲說明</p><p class="hinttext">支援將軍、將死、逼和、王車易位、吃過路兵與升變。選取棋子後，綠點代表可走位置，圓圈代表可吃棋子。</p></section></aside></div><div class="footer">棋局在你的瀏覽器中進行</div></main>
<div id="promotion" class="promotion"><div class="modal"><strong>選擇升變棋子</strong><div class="choices" id="choices"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script>
(()=>{const glyph={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),movesEl=document.getElementById('moves');let game=new Chess(),selected=null,flipped=false,lastMove=null,pending=null;const files='abcdefgh',ranks='87654321';
function draw(){boardEl.innerHTML='';const rows=flipped?[...ranks].reverse():[...ranks],cols=flipped?[...files].reverse():[...files];const checkSq=game.in_check()?game.board().flatMap((row,ri)=>row.map((p,ci)=>p&&p.type==='k'&&p.color===game.turn()?files[ci]+(8-ri):null).filter(Boolean))[0]:null;for(const r of rows)for(const f of cols){const sq=document.createElement('div'),piece=game.get(f+r),moves=selected?game.moves({square:selected,verbose:true}):[];sq.className='sq '+(((files.indexOf(f)+(8-Number(r)))%2===0)?'light':'dark');sq.dataset.square=f+r;if(selected===f+r)sq.classList.add('selected');if(lastMove&&(lastMove.from===f+r||lastMove.to===f+r))sq.classList.add('last');if(checkSq===f+r)sq.classList.add('check');const target=moves.find(m=>m.to===f+r);if(target)sq.classList.add(piece?'capture':'hint');if((!flipped&&f==='a')||(flipped&&f==='h')){let c=document.createElement('span');c.className='coord';c.textContent=r;sq.append(c)}if((!flipped&&r==='1')||(flipped&&r==='8')){let c=document.createElement('span');c.className='coord file';c.textContent=f;sq.append(c)}if(piece){let p=document.createElement('span');p.className='piece '+(piece.color==='w'?'white':'black');p.textContent=glyph[piece.color+piece.type];sq.append(p)}sq.onclick=()=>clickSquare(f+r);boardEl.append(sq)}renderInfo()}
function clickSquare(s){if(game.game_over())return;const piece=game.get(s);if(selected){let opts=game.moves({square:selected,verbose:true}).filter(m=>m.to===s);if(!opts.length){const king=game.get(selected);if(king&&king.type==='k'&&piece&&piece.type==='r'&&piece.color===king.color){opts=game.moves({square:selected,verbose:true}).filter(m=>(m.flags.includes('k')||m.flags.includes('q'))&&((m.flags.includes('k')&&files.indexOf(s)>files.indexOf(selected))||(m.flags.includes('q')&&files.indexOf(s)<files.indexOf(selected))))}}if(opts.length){const m=opts[0];if(m.flags.includes('p')){pending={from:selected,to:m.to};showPromotion(game.turn());return}game.move({from:selected,to:m.to});lastMove={from:selected,to:m.to};selected=null;draw();return}}if(piece&&piece.color===game.turn()){selected=s;draw()}else{selected=null;draw()}}
function showPromotion(color){const el=document.getElementById('promotion'),choices=document.getElementById('choices');choices.innerHTML='';for(const t of ['q','r','b','n']){const b=document.createElement('button');b.textContent=glyph[color+t];b.onclick=()=>{game.move({from:pending.from,to:pending.to,promotion:t});lastMove={...pending};pending=null;el.classList.remove('show');selected=null;draw()};choices.append(b)}el.classList.add('show')}
function renderInfo(){let title=game.turn()==='w'?'白方回合':'黑方回合',status='輪到'+(game.turn()==='w'?'白方':'黑方');if(game.in_checkmate()){title='對局結束';status=(game.turn()==='w'?'黑方':'白方')+'將死獲勝！'}else if(game.in_stalemate()){title='對局和棋';status='逼和，雙方平手'}else if(game.in_draw()){title='對局和棋';status='和棋'}else if(game.in_check())status+=' — 將軍！';document.getElementById('turnTitle').textContent=title;document.getElementById('turnIcon').textContent=game.turn()==='w'?'♙':'♟';statusEl.textContent=status;document.getElementById('undo').disabled=game.history().length===0;const hist=game.history();if(!hist.length){movesEl.innerHTML='<span style="color:#aab5a7">尚未開始走棋</span>';return}let rows='';for(let i=0;i<hist.length;i+=2)rows+=`<div class="move-row"><span>${i/2+1}.</span><span>${hist[i]}</span><span>${hist[i+1]||''}</span></div>`;movesEl.innerHTML=rows;movesEl.scrollTop=movesEl.scrollHeight}
document.getElementById('undo').onclick=()=>{if(game.undo()){game.undo();lastMove=null;const h=game.history({verbose:true});if(h.length)lastMove={from:h[h.length-1].from,to:h[h.length-1].to};selected=null;draw()}};document.getElementById('flip').onclick=()=>{flipped=!flipped;draw()};document.getElementById('new').onclick=()=>{if(game.history().length&&!confirm('要結束目前棋局並開始新對局嗎？'))return;game=new Chess();selected=null;lastMove=null;draw()};draw()})();
</script></body></html>
